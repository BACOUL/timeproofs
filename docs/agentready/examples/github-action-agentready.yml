name: AgentReady CI Gate

on:
  pull_request:
    paths:
      - openapi.json
      - mcp-tools.json
      - .github/workflows/agentready.yml
  workflow_dispatch:

jobs:
  agentready:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: AgentReady OpenAPI gate
        id: openapi_gate
        uses: BACOUL/timeproofs@agentready-action-v0.1.0-alpha.0
        with:
          type: openapi
          file: ./openapi.json
          min-score: '75'
          fail-on: critical
          out: agentready-output/openapi

      - name: AgentReady MCP gate
        id: mcp_gate
        uses: BACOUL/timeproofs@agentready-action-v0.1.0-alpha.0
        with:
          type: mcp
          file: ./mcp-tools.json
          min-score: '75'
          fail-on: critical
          out: agentready-output/mcp

      - name: Print AgentReady summary
        if: always()
        run: |
          echo "OpenAPI: ${{ steps.openapi_gate.outputs.score }} - ${{ steps.openapi_gate.outputs.status }}"
          echo "OpenAPI report: ${{ steps.openapi_gate.outputs.report-path }}"
          echo "MCP: ${{ steps.mcp_gate.outputs.score }} - ${{ steps.mcp_gate.outputs.status }}"
          echo "MCP report: ${{ steps.mcp_gate.outputs.report-path }}"

# Security-hardened full-SHA form, populated after the owner checkpoint:
#
# uses: BACOUL/timeproofs@<FULL_ACTION_RELEASE_COMMIT_SHA>
#
# Local repository development reference only:
#
# uses: ./
