openapi: 3.1.0

info:
  title: TimeProofs API
  version: v0.2
  description: |
    TimeProofs is a privacy-first, edge-native API for digital proof of existence.

    v0.2 introduces a stateless timestamp model:
    - The server never stores proofs.
    - You send only SHA-256 hashes.
    - The API returns a signed timestamp response.
    - Clients build `.tproof.json` bundles locally and verify offline.

    This OpenAPI file describes the v0.2 stateless API only.

    Principles:
    - Hash locally (SHA-256)
    - Timestamp via API
    - Verify offline (portable bundles)
    - No files, no personal data, no blockchain

  contact:
    name: TimeProofs
    url: https://timeproofs.io
    email: contact@timeproofs.io

  license:
    name: MPL-2.0
    url: https://www.mozilla.org/en-US/MPL/2.0/

servers:
  - url: https://timeproofs-api-v02.jeason-bacoul.workers.dev
    description: v0.2 Dev Preview (stateless)

tags:
  - name: Core
    description: Core timestamp endpoint
  - name: Utility
    description: Diagnostic and health endpoints

paths:
  /api/health:
    get:
      summary: Health check (v0.2)
      description: Returns version, mode, and timestamp.
      operationId: healthV02
      tags: [Utility]
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/timestamp:
    post:
      summary: Create a stateless timestamp proof (v0.2)
      description: |
        Submit a SHA-256 hash to obtain a stateless timestamp response.

        The server:
        - validates the hash format
        - derives a canonical payload (hash | issuedAt | issuer | nonce)
        - computes an HMAC-SHA256 (if configured)
        - returns timestamp + proof

        The server stores nothing.
        Clients must build `.tproof.json` bundles locally.
      operationId: createTimestampV02
      tags: [Core]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimestampRequestV02"

      responses:
        "200":
          description: Stateless timestamp response (v0.2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimestampResponseV02"

        "400":
          description: Invalid request body or hash format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/verify:
    get:
      summary: Verify (not implemented in v0.2)
      description: |
        v0.2 performs offline verification only using `.tproof.json` bundles.
        This endpoint always returns a 501 error.

        The legacy v0.1 verify endpoint remains active on production (not described here).
      operationId: verifyV02
      tags: [Core]
      responses:
        "501":
          description: Not implemented in v0.2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [ok, now, version, mode]
      properties:
        ok:
          type: boolean
          example: true
        now:
          type: string
          format: date-time
        version:
          type: string
          example: "timeproofs-0.2"
        mode:
          type: string
          example: "stateless"

    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: invalid_hash
        message:
          type: string
          nullable: true
          example: "hash must be lowercase hex sha256 (64 chars)"
        code:
          type: integer
          nullable: true
          example: 2102
        version:
          type: string
          nullable: true
          example: "timeproofs-0.2"

    TimestampRequestV02:
      type: object
      required: [hash]
      additionalProperties: false
      properties:
        hash:
          type: string
          description: SHA-256 hex string (64 lowercase hex).
          minLength: 64
          maxLength: 64
          pattern: "^[a-f0-9]{64}$"
          example: "bbbbee25f8ebb60fa512ad3e02460bd4cc7ec4a41850c5cc8636e67d99f0b3b2"

    HashObject:
      type: object
      required: [algorithm, value]
      additionalProperties: false
      properties:
        algorithm:
          type: string
          example: "SHA-256"
        value:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[a-f0-9]{64}$"
          example: "bbbbee25f8ebb60fa512ad3e02460bd4cc7ec4a41850c5cc8636e67d99f0b3b2"

    TimestampObject:
      type: object
      required: [issuedAt, issuer, nonce]
      additionalProperties: false
      properties:
        issuedAt:
          type: string
          format: date-time
        issuer:
          type: string
          example: "https://api.timeproofs.io"
        nonce:
          type: string
          description: Server-generated nonce to prevent replay/collision.
          example: "u4dJ9zQqQm2pXc3m"

    ProofObject:
      type: object
      required: [algo, keyId]
      additionalProperties: false
      properties:
        algo:
          type: string
          example: "HMAC-SHA256"
        hmac:
          type: string
          nullable: true
          description: Base64-encoded HMAC over canonical payload.
          example: "mZp8yKcNQk2m9f9l3v2eYwq0cZcZ9rj6uRrKxg0oQp8="
        signature:
          type: string
          nullable: true
          description: Reserved for future signature schemes (e.g. Ed25519).
        publicKey:
          type: string
          nullable: true
          description: Reserved for future signature schemes (e.g. Ed25519).
        keyId:
          type: string
          example: "tp-v0-2-main"

    TimestampResponseV02:
      type: object
      required: [version, hash, timestamp, proof]
      additionalProperties: false
      properties:
        version:
          type: string
          example: "timeproofs-0.2"
        hash:
          $ref: "#/components/schemas/HashObject"
        timestamp:
          $ref: "#/components/schemas/TimestampObject"
        proof:
          $ref: "#/components/schemas/ProofObject"

security: []
externalDocs:
  description: Full documentation and examples
  url: https://timeproofs.io/docs.html
