<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 420">
  <title id="title">AgentReady standard flow</title>
  <desc id="desc">OpenAPI and MCP contracts flow through static AgentReady rules to JSON, Markdown reports, CI policy and remediation review.</desc>
  <rect width="960" height="420" fill="#f7faf9"/>
  <g font-family="Arial, sans-serif" fill="#10201f">
    <rect x="40" y="70" width="200" height="110" rx="8" fill="#ffffff" stroke="#23756d"/>
    <text x="70" y="112" font-size="22" font-weight="700">Contracts</text>
    <text x="70" y="145" font-size="16">OpenAPI + MCP</text>
    <path d="M250 125h120" stroke="#d59a22" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="380" y="50" width="240" height="150" rx="8" fill="#eaf4f2" stroke="#23756d"/>
    <text x="418" y="96" font-size="22" font-weight="700">Static rules</text>
    <text x="418" y="128" font-size="16">AR001 through AR010</text>
    <text x="418" y="158" font-size="16">score + policy gate</text>
    <path d="M630 125h100" stroke="#d59a22" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="740" y="70" width="180" height="110" rx="8" fill="#ffffff" stroke="#23756d"/>
    <text x="770" y="112" font-size="22" font-weight="700">Outputs</text>
    <text x="770" y="145" font-size="16">JSON + report</text>
    <rect x="90" y="270" width="220" height="90" rx="8" fill="#fff7e8" stroke="#d59a22"/>
    <text x="120" y="305" font-size="18" font-weight="700">CI decision</text>
    <text x="120" y="334" font-size="15">PASS or FAIL</text>
    <rect x="370" y="270" width="220" height="90" rx="8" fill="#ffffff" stroke="#23756d"/>
    <text x="400" y="305" font-size="18" font-weight="700">Review evidence</text>
    <text x="400" y="334" font-size="15">rule codes + fixes</text>
    <rect x="650" y="270" width="220" height="90" rx="8" fill="#ffffff" stroke="#23756d"/>
    <text x="680" y="305" font-size="18" font-weight="700">Remediation</text>
    <text x="680" y="334" font-size="15">contract changes</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d59a22"/></marker></defs>
</svg>