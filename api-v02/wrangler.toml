# api-v02/wrangler.toml
# Cloudflare Worker config for TimeProofs API v0.2
# This does NOT replace the v0.1 worker currently in production.

name = "timeproofs-api-v02"
main = "worker.js"
compatibility_date = "2025-01-01"

# Cloudflare account ID
account_id = "99b6f748770d2257d27409b27b9e1bea"

# v0.2 runs ONLY on workers.dev (safe, isolated from v0.1)
workers_dev = true

[vars]
# TimeProofs v0.2 reuses the same server HMAC secret as v0.1.
# DO NOT write the secret here.
# Set it using:
#   wrangler secret put HMAC_SECRET
