name: TimeProofs Upstream Protocol Watch

on:
  push:
    branches: [relaunch/invariant-engine]
    paths:
      - 'protocols/upstream-lock.json'
      - 'scripts/check-upstream-protocol-lock.mjs'
      - '.github/workflows/timeproofs-upstream-watch.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  protocol-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare reviewed protocol schema blobs with upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-upstream-protocol-lock.mjs
