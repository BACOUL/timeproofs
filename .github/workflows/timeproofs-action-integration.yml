name: TimeProofs Customer Action Integration
on:
  push:
    branches: [relaunch/invariant-engine]
  pull_request:
permissions:
  contents: read
jobs:
  customer-action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build customer fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/timeproofs-customer"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const dir = `${process.env.RUNNER_TEMP}/timeproofs-customer`;
          const checkoutProof = 'timeproofs-ci-checkout-proof';
          const transaction_id = crypto.createHash('sha256').update(checkoutProof,'utf8').digest('base64url');
          const checkout = { ucp:{version:'2026-04-08'}, id:'checkout_ci', line_items:[], status:'ready_for_complete', currency:'EUR', totals:[{type:'total',amount:760}], links:[] };
          const payment = { vct:'mandate.payment.1', transaction_id, payee:{name:'Merchant'}, payment_amount:{currency:'EUR',amount:760}, payment_instrument:{type:'CARD',id:'pi_ci'} };
          fs.writeFileSync(`${dir}/checkout.json`,JSON.stringify(checkout),{mode:0o600});
          fs.writeFileSync(`${dir}/payment.json`,JSON.stringify(payment),{mode:0o600});
          fs.writeFileSync(`${dir}/proof.txt`,checkoutProof,{mode:0o600});
          NODE
      - name: Customer uses TimeProofs
        id: tp
        uses: ./
        with:
          checkout: ${{ runner.temp }}/timeproofs-customer/checkout.json
          payment-mandate: ${{ runner.temp }}/timeproofs-customer/payment.json
          checkout-jwt-file: ${{ runner.temp }}/timeproofs-customer/proof.txt
          output: ${{ runner.temp }}/timeproofs-customer/result.json
      - name: Assert customer contract and secret safety
        shell: bash
        env:
          DECISION: ${{ steps.tp.outputs.decision }}
          RESULT: ${{ steps.tp.outputs.result-file }}
        run: |
          set -euo pipefail
          test "$DECISION" = PASS
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const proof=fs.readFileSync(`${process.env.RUNNER_TEMP}/timeproofs-customer/proof.txt`,'utf8').trim();
          const raw=fs.readFileSync(process.env.RESULT,'utf8');
          if(raw.includes(proof)) throw new Error('raw checkout proof leaked into result');
          const j=JSON.parse(raw);
          if(j.decision!=='PASS') throw new Error(`expected PASS, got ${j.decision}`);
          if(!j.core_schema_version) throw new Error('missing core_schema_version');
          if(!j.metadata?.pack?.version) throw new Error('missing pack version');
          NODE
