name: Finalize AgentReady Marketplace PR

on:
  pull_request:
    branches:
      - timeproofs
    paths:
      - '.github/workflows/finalize-agentready-marketplace-pr.yml'
      - '.github/workflows/finalize-agentready-marketplace.yml'
      - 'scripts/finalize-agentready-marketplace.mjs'
      - 'agentready-ci.html'
      - 'docs/agentready/**'
      - 'scripts/rebuild-agentready-ledger-data.mjs'
      - 'README.md'
      - 'AGENTREADY_PROJECT_CONTEXT.md'
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: agentready-action-v0.1.0-alpha.0
      APPROVED_SHA: d6634d0fbbe1fced510fc49d8871d52a3dc7f348
      MERGE_SHA: 3070e7827e8118ca62ad6cdb7c37deff9ef24b47
      RELEASE_URL: https://github.com/BACOUL/timeproofs/releases/tag/agentready-action-v0.1.0-alpha.0
      MARKETPLACE_URL: https://github.com/marketplace/actions/agentready-ci-gate-by-timeproofs
      PUBLIC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-finalize-agentready-marketplace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify immutable tag and prerelease
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" --jq '.object.sha')" = "$APPROVED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.draft')" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.prerelease')" = "true"
      - name: Verify Marketplace page
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0' "$MARKETPLACE_URL" -o /tmp/marketplace.html
          grep -qi 'AgentReady CI Gate by TimeProofs' /tmp/marketplace.html
      - name: Public OpenAPI tag smoke
        id: openapi
        uses: BACOUL/timeproofs@agentready-action-v0.1.0-alpha.0
        with:
          type: openapi
          file: ./agentready-examples/valid-simple-openapi.json
          min-score: '0'
          fail-on: none
          out: public-openapi-output
      - name: Public MCP tag smoke
        id: mcp
        uses: BACOUL/timeproofs@agentready-action-v0.1.0-alpha.0
        with:
          type: mcp
          file: ./agentready-examples/mcp-tools-simple.json
          min-score: '0'
          fail-on: none
          out: public-mcp-output
      - name: Verify public outputs
        run: |
          test -n "${{ steps.openapi.outputs.score }}"
          test -n "${{ steps.openapi.outputs.status }}"
          test -f "${{ steps.openapi.outputs.report-path }}"
          test -f "${{ steps.openapi.outputs.contract-path }}"
          test -n "${{ steps.mcp.outputs.score }}"
          test -n "${{ steps.mcp.outputs.status }}"
          test -f "${{ steps.mcp.outputs.report-path }}"
          test -f "${{ steps.mcp.outputs.contract-path }}"
      - name: Generate final evidence
        run: node scripts/finalize-agentready-marketplace.mjs
      - name: Regenerate canonical views
        run: |
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
      - name: Core tests
        run: node agentready-core/tests/run-agentready-core-tests.mjs
      - name: CLI tests
        run: node cli/tests/run-agentready-cli-tests.mjs
      - name: Action smoke test
        run: node cli/tests/run-agentready-action-smoke-test.mjs
      - name: Package smoke test
        run: node cli/tests/run-agentready-package-smoke-test.mjs
      - name: Community release workflow test
        run: node cli/tests/run-agentready-community-release-workflow-test.mjs
      - name: Marketplace readiness validator
        run: node scripts/validate-agentready-action-marketplace-readiness.mjs
      - name: Strategy validator
        run: node scripts/validate-agentready-strategy-docs.mjs
      - name: Execution system validator
        run: node scripts/validate-agentready-execution-system.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit generated evidence
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentready-ci.html README.md AGENTREADY_PROJECT_CONTEXT.md CHANGELOG.md docs/agentready scripts/rebuild-agentready-ledger-data.mjs
          git commit -m 'docs(agentready): finalize Marketplace publication evidence [marketplace-finalized]'
          git push origin HEAD:docs-finalize-agentready-marketplace
