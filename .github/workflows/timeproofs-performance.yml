name: TimeProofs Performance Baseline

on:
  push:
    branches: [relaunch/invariant-engine]
    paths:
      - 'timeproofs-core/**'
      - 'adapters/**'
      - 'sdk/**'
      - 'benchmarks/**'
      - '.github/workflows/timeproofs-performance.yml'
  pull_request:
    paths:
      - 'timeproofs-core/**'
      - 'adapters/**'
      - 'sdk/**'
      - 'benchmarks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify 1000-line-item baseline
        run: node benchmarks/verify-benchmark.mjs
