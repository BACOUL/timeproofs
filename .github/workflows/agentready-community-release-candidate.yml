name: Bootstrap ARB-COM-002 Refinement

on:
  push:
    branches:
      - docs-agentready-refine-arb-com-002
  pull_request:
    branches:
      - timeproofs
    paths:
      - ".github/workflows/agentready-community-release-candidate.yml"
      - ".github/workflows/refine-arb-com-002.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: docs-agentready-refine-arb-com-002
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore canonical workflow and apply refinement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin timeproofs
          git show origin/timeproofs:.github/workflows/agentready-community-release-candidate.yml > .github/workflows/agentready-community-release-candidate.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow_text = Path('.github/workflows/refine-arb-com-002.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Regenerate and validate governance"
          start = workflow_text.index(start_marker) + len(start_marker)
          end = workflow_text.index(end_marker, start)
          embedded = textwrap.dedent(workflow_text[start:end])
          exec(compile(embedded, 'embedded-arb-com-002-refinement.py', 'exec'))
          PY

      - name: Regenerate and validate governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
          node cli/tests/run-agentready-community-release-workflow-test.mjs
          node scripts/validate-agentready-strategy-docs.mjs
          node scripts/validate-agentready-execution-system.mjs
          git diff --check
          grep -F "Batch ID: ARB-COM-002" docs/agentready/NEXT_CODEX_PROMPT.md
          grep -F "Branch: feat-distribution-agentready-marketplace-action" docs/agentready/NEXT_CODEX_PROMPT.md
          grep -F "Specification: EXECUTION_READY" docs/agentready/NEXT_ACTION.md
          grep -F "Action type: READY" docs/agentready/NEXT_ACTION.md

      - name: Commit validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-arb-com-002.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(agentready): refine ARB-COM-002 execution specification"
          git push origin HEAD:docs-agentready-refine-arb-com-002
