name: Apply AgentReady Premium Site Plan

on:
  push:
    branches:
      - docs-agentready-premium-site-plan
  pull_request:
    branches:
      - timeproofs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-agentready-premium-site-plan
          fetch-depth: 0
      - name: Check whether migration is pending
        id: guard
        shell: bash
        run: |
          if test -f scripts/apply-agentready-premium-site-plan.mjs; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.needed == 'true'
        with:
          node-version: '20'
      - name: Apply canonical plan changes
        if: steps.guard.outputs.needed == 'true'
        run: node scripts/apply-agentready-premium-site-plan.mjs
      - name: Rebuild canonical ledger and views
        if: steps.guard.outputs.needed == 'true'
        run: |
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
      - name: Validate strategy and execution system
        if: steps.guard.outputs.needed == 'true'
        run: |
          node scripts/validate-agentready-strategy-docs.mjs
          node scripts/validate-agentready-execution-system.mjs
          git diff --check
      - name: Verify premium batch is the next executable prompt
        if: steps.guard.outputs.needed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { readLedger, selectNextAction } from './scripts/agentready-execution-lib.mjs';
          const ledger = readLedger();
          const batches = new Map(ledger.execution_batches.map((batch) => [batch.id, batch]));
          const next = selectNextAction(ledger);
          const prompt = fs.readFileSync('docs/agentready/NEXT_CODEX_PROMPT.md', 'utf8');
          assert.equal(batches.get('ARB-COM-002')?.status, 'DONE');
          assert.equal(batches.get('ARB-SITE-PREMIUM-001')?.status, 'READY');
          assert.equal(batches.get('ARB-SITE-PREMIUM-001')?.spec_status, 'EXECUTION_READY');
          assert.deepEqual(batches.get('ARB-SITE-PREMIUM-001')?.depends_on_batches, ['ARB-COM-002']);
          assert.deepEqual(batches.get('ARB-COM-003')?.depends_on_batches, ['ARB-SITE-PREMIUM-003']);
          assert.equal(next?.batch?.id, 'ARB-SITE-PREMIUM-001');
          assert.equal(next?.action_type, 'READY');
          assert.match(prompt, /Batch ID: ARB-SITE-PREMIUM-001/);
          assert.match(prompt, /site-agentready-premium-foundation/);
          assert.match(prompt, /Premium Site Redesign Execution Specification/);
          NODE
      - name: Verify deterministic regeneration
        if: steps.guard.outputs.needed == 'true'
        run: |
          git diff > /tmp/before.diff
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
          git diff > /tmp/after.diff
          cmp /tmp/before.diff /tmp/after.diff
      - name: Commit governed plan
        if: steps.guard.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(plan): insert premium site gate before public validation [premium-plan-applied]'
          git push origin HEAD:docs-agentready-premium-site-plan
