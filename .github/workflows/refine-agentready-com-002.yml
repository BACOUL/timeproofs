name: Refine AgentReady COM-002

on:
  push:
    branches:
      - docs-agentready-com-002-execution-ready
    paths:
      - scripts/refine-agentready-com-002.mjs
      - .github/workflows/refine-agentready-com-002.yml
  pull_request:
    branches:
      - timeproofs
    paths:
      - scripts/refine-agentready-com-002.mjs
      - .github/workflows/refine-agentready-com-002.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out specification branch
        uses: actions/checkout@v4
        with:
          ref: docs-agentready-com-002-execution-ready
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply COM-002 specification refinement
        run: node scripts/refine-agentready-com-002.mjs

      - name: Rebuild canonical execution ledger
        run: node scripts/rebuild-agentready-ledger-data.mjs

      - name: Generate canonical views and prompt
        run: |
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write

      - name: Validate strategy documents
        run: node scripts/validate-agentready-strategy-docs.mjs

      - name: Validate execution system
        run: node scripts/validate-agentready-execution-system.mjs

      - name: Validate Community release workflow guards
        run: node cli/tests/run-agentready-community-release-workflow-test.mjs

      - name: Validate diff formatting
        run: git diff --check

      - name: Verify generated executable prompt
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { generatedContents, readLedger, selectNextAction } from './scripts/agentready-execution-lib.mjs';

          const ledger = readLedger();
          const batch = (ledger.execution_batches || []).find((item) => item.id === 'ARB-COM-002');
          const next = selectNextAction(ledger);
          const prompt = generatedContents(ledger)['docs/agentready/NEXT_CODEX_PROMPT.md'];

          assert.equal(batch?.status, 'READY');
          assert.equal(batch?.spec_status, 'EXECUTION_READY');
          assert.equal(batch?.owner, 'CODEX_AND_JEASON');
          assert.equal(next?.kind, 'batch');
          assert.equal(next?.batch?.id, 'ARB-COM-002');
          assert.equal(next?.action_type, 'READY');
          assert.match(prompt, /Repository: BACOUL\/timeproofs/);
          assert.match(prompt, /Batch ID: ARB-COM-002/);
          assert.match(prompt, /action\.yml/);
          assert.match(prompt, /agentready-action-v0\.1\.0-alpha\.0/);
          assert.match(prompt, /Point de contrôle propriétaire obligatoire/);
          assert.match(prompt, /no npm operation/i);
          NODE

      - name: Verify deterministic regeneration
        run: |
          git diff > /tmp/com002-before.diff
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
          git diff > /tmp/com002-after.diff
          cmp /tmp/com002-before.diff /tmp/com002-after.diff

      - name: Remove one-time refinement helpers
        run: |
          rm scripts/refine-agentready-com-002.mjs
          rm .github/workflows/refine-agentready-com-002.yml

      - name: Commit validated execution-ready specification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(distribution): make ARB-COM-002 execution ready"
          git push origin HEAD:docs-agentready-com-002-execution-ready
