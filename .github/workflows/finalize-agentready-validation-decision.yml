name: Finalize AgentReady validation decision

on:
  push:
    branches:
      - docs-agentready-strengthen-validation-gates
    paths:
      - .github/workflows/finalize-agentready-validation-decision.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance branch
        uses: actions/checkout@v4
        with:
          ref: docs-agentready-strengthen-validation-gates
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore previous decision status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/agentready/DECISION_LOG.md')
          text = path.read_text()
          before = 'Supersedes: informal operations.\n\n## 2026-07-12 - Earlier validation gates before Pro and commercial infrastructure'
          after = 'Supersedes: informal operations.\nStatus: ACTIVE\n\n## 2026-07-12 - Earlier validation gates before Pro and commercial infrastructure'
          if before not in text:
              raise SystemExit('Decision-log status insertion anchor not found')
          path.write_text(text.replace(before, after, 1))
          PY

      - name: Validate strategy and execution system
        run: |
          node scripts/validate-agentready-strategy-docs.mjs
          node scripts/validate-agentready-execution-system.mjs
          git diff --check

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/finalize-agentready-validation-decision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(governance): finalize validation gate decision"
          git push origin HEAD:docs-agentready-strengthen-validation-gates
