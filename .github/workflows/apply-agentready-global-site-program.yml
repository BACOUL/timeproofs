name: Finalize AgentReady Global Standard Site Program

on:
  pull_request:
    branches:
      - timeproofs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-agentready-global-site-program
          fetch-depth: 0
      - name: Check whether validator correction is pending
        id: guard
        shell: bash
        run: |
          if test -f scripts/fix-agentready-stacked-validator.mjs; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.needed == 'true'
        with:
          node-version: '20'
      - name: Correct stacked batch validation and remove temporary files
        if: steps.guard.outputs.needed == 'true'
        run: node scripts/fix-agentready-stacked-validator.mjs
      - name: Regenerate canonical views
        if: steps.guard.outputs.needed == 'true'
        run: |
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
      - name: Validate final governance state
        if: steps.guard.outputs.needed == 'true'
        run: |
          node scripts/validate-agentready-strategy-docs.mjs
          node scripts/validate-agentready-execution-system.mjs
          git diff --check
      - name: Verify global product prompt
        if: steps.guard.outputs.needed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { readLedger, selectNextAction } from './scripts/agentready-execution-lib.mjs';
          const ledger = readLedger();
          const batches = new Map(ledger.execution_batches.map((batch) => [batch.id, batch]));
          const next = selectNextAction(ledger);
          const prompt = fs.readFileSync('docs/agentready/NEXT_CODEX_PROMPT.md', 'utf8');
          assert.equal(batches.get('ARB-SITE-PREMIUM-001')?.status, 'IN_REVIEW');
          assert.equal(batches.get('ARB-SITE-PREMIUM-001')?.pr_number, 132);
          assert.equal(batches.get('ARB-SITE-GLOBAL-002')?.status, 'READY');
          assert.equal(batches.get('ARB-SITE-GLOBAL-002')?.stacked_execution_authorized, true);
          assert.equal(next?.batch?.id, 'ARB-SITE-GLOBAL-002');
          assert.equal(next?.action_type, 'READY');
          assert.match(prompt, /Base: site-agentready-premium-foundation/);
          assert.match(prompt, /Batch ID: ARB-SITE-GLOBAL-002/);
          assert.match(prompt, /24 EUR excluding tax/);
          NODE
      - name: Commit final non-workflow state
        if: steps.guard.outputs.needed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/agentready-community-release-candidate.yml .github/workflows/apply-agentready-global-site-program.yml || true
          git commit -m 'fix(plan): authorize validated stacked site execution'
          git push origin HEAD:docs-agentready-global-site-program
