name: Apply AgentReady Global Standard Site Program

on:
  push:
    branches:
      - docs-agentready-global-site-program

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[global-site-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-agentready-global-site-program
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve temporary migration files for commit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-agentready-global-site-program.mjs')
          text = p.read_text()
          block = '''for (const file of ["scripts/apply-agentready-global-site-program.mjs", ".github/workflows/apply-agentready-global-site-program.yml"]) {
            if (fs.existsSync(file)) fs.rmSync(file);
          }

          '''
          if block not in text:
              raise SystemExit('temporary cleanup block not found')
          p.write_text(text.replace(block, ''))
          PY
      - name: Apply global standard site governance
        run: node scripts/apply-agentready-global-site-program.mjs
      - name: Regenerate canonical execution system
        run: |
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
      - name: Record validation diagnostics
        shell: bash
        run: |
          set +e
          out='docs/agentready/GLOBAL_SITE_MIGRATION_DIAGNOSTIC.txt'
          : > "$out"
          for cmd in \
            'node scripts/validate-agentready-strategy-docs.mjs' \
            'node scripts/validate-agentready-execution-system.mjs' \
            'node cli/tests/run-agentready-community-release-workflow-test.mjs' \
            'git diff --check'
          do
            echo "> $cmd" >> "$out"
            bash -lc "$cmd" >> "$out" 2>&1
            status=$?
            echo "exit=$status" >> "$out"
            echo >> "$out"
          done
          node --input-type=module >> "$out" 2>&1 <<'NODE'
          import fs from 'node:fs';
          import { readLedger, selectNextAction } from './scripts/agentready-execution-lib.mjs';
          const ledger = readLedger();
          const batches = new Map(ledger.execution_batches.map((batch) => [batch.id, batch]));
          const next = selectNextAction(ledger);
          console.log(JSON.stringify({
            foundation: batches.get('ARB-SITE-PREMIUM-001'),
            product: batches.get('ARB-SITE-GLOBAL-002'),
            installation: batches.get('ARB-COM-003'),
            next,
            prompt: fs.readFileSync('docs/agentready/NEXT_CODEX_PROMPT.md', 'utf8')
          }, null, 2));
          NODE
          exit 0
      - name: Commit generated governance and diagnostics
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(plan): establish global standard site program [global-site-applied]'
          git push origin HEAD:docs-agentready-global-site-program
