name: Apply AgentReady Global Standard Site Program

on:
  push:
    branches:
      - docs-agentready-global-site-program

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-agentready-global-site-program
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply global standard site governance
        run: node scripts/apply-agentready-global-site-program.mjs
      - name: Regenerate canonical execution system
        run: |
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
      - name: Validate governance and permanent guards
        run: |
          node scripts/validate-agentready-strategy-docs.mjs
          node scripts/validate-agentready-execution-system.mjs
          node cli/tests/run-agentready-community-release-workflow-test.mjs
          git diff --check
      - name: Verify stacked global-site next action
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { readLedger, selectNextAction } from './scripts/agentready-execution-lib.mjs';
          const ledger = readLedger();
          const batches = new Map(ledger.execution_batches.map((batch) => [batch.id, batch]));
          const foundation = batches.get('ARB-SITE-PREMIUM-001');
          const product = batches.get('ARB-SITE-GLOBAL-002');
          const installation = batches.get('ARB-COM-003');
          const next = selectNextAction(ledger);
          const prompt = fs.readFileSync('docs/agentready/NEXT_CODEX_PROMPT.md', 'utf8');
          assert.equal(foundation?.status, 'IN_REVIEW');
          assert.equal(foundation?.pr_number, 132);
          assert.equal(product?.status, 'READY');
          assert.equal(product?.spec_status, 'EXECUTION_READY');
          assert.equal(product?.base_branch, 'site-agentready-premium-foundation');
          assert.equal(product?.stacked_execution_authorized, true);
          assert.equal(product?.stacked_on_batch, 'ARB-SITE-PREMIUM-001');
          assert.ok((installation?.depends_on_batches || []).includes('ARB-SITE-GLOBAL-007'));
          assert.equal(next?.batch?.id, 'ARB-SITE-GLOBAL-002');
          assert.equal(next?.action_type, 'READY');
          assert.match(prompt, /Base: site-agentready-premium-foundation/);
          assert.match(prompt, /Batch ID: ARB-SITE-GLOBAL-002/);
          assert.match(prompt, /site-agentready-global-product/);
          assert.match(prompt, /24 EUR excluding tax/);
          NODE
      - name: Verify deterministic regeneration
        run: |
          git diff > /tmp/before.diff
          node scripts/rebuild-agentready-ledger-data.mjs
          node scripts/generate-agentready-ledger-views.mjs --write
          node scripts/generate-agentready-status.mjs --write
          node scripts/generate-agentready-next-action.mjs --write
          node scripts/generate-agentready-next-prompt.mjs --write
          git diff > /tmp/after.diff
          cmp /tmp/before.diff /tmp/after.diff
      - name: Commit final governance state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(plan): establish global standard site program'
          git push origin HEAD:docs-agentready-global-site-program
