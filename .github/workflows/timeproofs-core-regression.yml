name: TimeProofs Core Regression

on:
  push:
    branches:
      - relaunch/invariant-engine
    paths:
      - 'timeproofs-core/**'
      - 'fixtures/ucp-ap2/v0.1/**'
      - 'fixtures/provider/**'
      - 'adapters/**'
      - 'integrations/**'
      - 'sdk/**'
      - 'cli/timeproofs.js'
      - 'bin/timeproofs.js'
      - 'ci/**'
      - 'schemas/**'
      - 'packs/**'
      - 'scripts/build-timeproofs-package.mjs'
      - 'scripts/m8-1-stripe-test-proof.mjs'
      - 'packaging/timeproofs/**'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/timeproofs-core-regression.yml'
  pull_request:
    paths:
      - 'timeproofs-core/**'
      - 'fixtures/ucp-ap2/v0.1/**'
      - 'fixtures/provider/**'
      - 'adapters/**'
      - 'integrations/**'
      - 'sdk/**'
      - 'cli/timeproofs.js'
      - 'bin/timeproofs.js'
      - 'ci/**'
      - 'schemas/**'
      - 'packs/**'
      - 'scripts/build-timeproofs-package.mjs'
      - 'scripts/m8-1-stripe-test-proof.mjs'
      - 'packaging/timeproofs/**'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked workspace
        run: npm ci --ignore-scripts
      - name: Run TimeProofs full local contract
        run: npm run test:timeproofs
