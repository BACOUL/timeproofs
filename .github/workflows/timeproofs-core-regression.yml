name: TimeProofs Core Regression

on:
  push:
    branches:
      - relaunch/invariant-engine
    paths:
      - 'timeproofs-core/**'
      - 'fixtures/ucp-ap2/v0.1/**'
      - 'adapters/**'
      - 'sdk/**'
      - 'cli/timeproofs.js'
      - 'bin/timeproofs.js'
      - 'package.json'
      - '.github/workflows/timeproofs-core-regression.yml'
  pull_request:
    paths:
      - 'timeproofs-core/**'
      - 'fixtures/ucp-ap2/v0.1/**'
      - 'adapters/**'
      - 'sdk/**'
      - 'cli/timeproofs.js'
      - 'bin/timeproofs.js'
      - 'package.json'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run TimeProofs full local contract
        run: npm run test:timeproofs
