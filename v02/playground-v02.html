<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TimeProofs v0.2 Playground - Proof bundle demo</title>
  <meta name="description" content="Local playground for hashing text, requesting a timestamp, and building a backward-compatible .tproof.json proof bundle without sending raw text by default."/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #9ca3af;
      font-size: 0.95rem;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-family: monospace;
    }
    button {
      margin-top: 0.75rem;
      margin-right: 0.5rem;
      padding: 0.5rem 0.9rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.primary {
      background: #06b6d4;
      color: #020617;
      font-weight: 600;
    }
    button.secondary {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #1f2937;
    }
    pre {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      background: #020617;
      border: 1px solid #1f2937;
      color: #e5e7eb;
      font-size: 0.85rem;
      overflow-x: auto;
    }
    .status {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #a5b4fc;
    }
    .error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <h1>TimeProofs v0.2 Playground</h1>
  <p>
    Local v0.2 test flow: hash → /api/timestamp (stateless) → bundle (.tproof.json, client-side).
    This page never sends raw text to the server, only the hash.
  </p>

  <label for="tp-input">Text to protect (demo, nothing is stored):</label>
  <textarea id="tp-input" placeholder="Type text here, for example a document summary, an AI output, or another demo value."></textarea>

  <div>
    <button class="primary" id="btn-run">Hash + Timestamp + Bundle</button>
    <button class="secondary" id="btn-hash">Hash only</button>
  </div>

  <div class="status" id="tp-status"></div>

  <pre id="tp-output" aria-label="Result"></pre>

  <!-- SDK v0.2 (UMD, exposes TimeProofsV02 globally) -->
  <script src="./sdk/timeproof.js"></script>
  <script>
    (function () {
      const inputEl = document.getElementById("tp-input");
      const outputEl = document.getElementById("tp-output");
      const statusEl = document.getElementById("tp-status");
      const btnRun = document.getElementById("btn-run");
      const btnHash = document.getElementById("btn-hash");

      if (!window.TimeProofsV02) {
        statusEl.textContent = "Error: TimeProofsV02 not found. Check the ./sdk/timeproof.js path.";
        statusEl.classList.add("error");
        return;
      }

      const tp = TimeProofsV02.createClient({
        // baseUrl: "https://api.timeproofs.io" // par défaut
      });

      function setStatus(msg, isError) {
        statusEl.textContent = msg || "";
        if (isError) {
          statusEl.classList.add("error");
        } else {
          statusEl.classList.remove("error");
        }
      }

      function setOutput(obj) {
        if (!obj) {
          outputEl.textContent = "";
          return;
        }
        outputEl.textContent = typeof obj === "string"
          ? obj
          : JSON.stringify(obj, null, 2);
      }

      btnHash.addEventListener("click", async () => {
        setStatus("");
        setOutput("");
        const text = inputEl.value || "";
        if (!text.trim()) {
          setStatus("Enter text before calculating the hash.", true);
          return;
        }
        try {
          setStatus("Calculating hash...");
          const hash = await tp.hashText(text);
          setStatus("Hash (SHA-256) calculated.");
          setOutput({ hash });
        } catch (err) {
          setStatus("Error: " + (err && err.message ? err.message : String(err)), true);
        }
      });

      btnRun.addEventListener("click", async () => {
        setStatus("");
        setOutput("");
        const text = inputEl.value || "";
        if (!text.trim()) {
          setStatus("Enter text before creating the proof bundle.", true);
          return;
        }
        try {
          setStatus("Calculating hash...");
          const hashHex = await tp.hashText(text);

          setStatus("Calling /api/timestamp (v0.2)...");
          const ts = await tp.timestamp(hashHex);

          setStatus("Building bundle locally (.tproof.json)...");
          const bundle = tp.createBundle({
            hash: ts.hash,
            timestamp: ts.timestamp,
            proof: ts.proof,
            meta: {
              type: "ai-output",
              domain: "demo",
              purpose: "playground-v0.2",
              tool: "timeproofs-playground",
              labels: ["demo", "playground", "v0.2"]
            }
          });

          setStatus("OK - bundle generated locally. Nothing is stored server-side.");
          setOutput({
            hash: hashHex,
            timestampResponse: ts,
            bundle
          });
        } catch (err) {
          setStatus("Error: " + (err && err.message ? err.message : String(err)), true);
        }
      });
    })();
  </script>
</body>
</html>
