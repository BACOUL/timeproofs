name: TimeProofs Verify
description: Verify cross-protocol consistency between UCP checkout and AP2 PaymentMandate artifacts.
author: TimeProofs
inputs:
  checkout:
    description: Path to a UCP 2026-04-08 checkout JSON file.
    required: true
  payment-mandate:
    description: Path to an AP2 mandate.payment.1 JSON file.
    required: true
  checkout-jwt:
    description: Exact checkout JWT value. Prefer a GitHub secret.
    required: false
    default: ''
  checkout-jwt-file:
    description: Path to a file containing the exact checkout JWT.
    required: false
    default: ''
  transformation:
    description: Optional declared payment transformation.
    required: false
    default: ''
  fail-on-unknown:
    description: Fail when TimeProofs returns UNKNOWN.
    required: false
    default: 'true'
  output:
    description: Safe JSON result path. Raw checkout JWT is never written to this file.
    required: false
    default: 'timeproofs-result.json'
outputs:
  decision:
    description: Aggregate decision (PASS, WARN, BLOCK, UNKNOWN).
    value: ${{ steps.verify.outputs.decision }}
  result-file:
    description: Path to the safe JSON result.
    value: ${{ steps.verify.outputs.result-file }}
runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        TP_CHECKOUT: ${{ inputs.checkout }}
        TP_PAYMENT: ${{ inputs.payment-mandate }}
        TP_JWT: ${{ inputs.checkout-jwt }}
        TP_JWT_FILE: ${{ inputs.checkout-jwt-file }}
        TP_TRANSFORMATION: ${{ inputs.transformation }}
        TP_FAIL_UNKNOWN: ${{ inputs.fail-on-unknown }}
        TP_OUTPUT: ${{ inputs.output }}
      run: node "$GITHUB_ACTION_PATH/ci/github-action.mjs"
branding:
  icon: shield
  color: blue
