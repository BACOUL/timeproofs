<!-- examples/browser-basic.html -->
<!-- TimeProofs v0.2 – Minimal browser example -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TimeProofs v0.2 – Browser Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family: system-ui; padding: 20px;">

  <h1>TimeProofs v0.2 – Browser Example</h1>
  <p>Demonstrates client-side hashing, timestamping, and bundle creation.</p>

  <!-- Load SDK -->
  <script src="../sdk/timeproof.js"></script>

  <script>
    (async () => {
      const tp = TimeProofsV02.createClient({
        baseUrl: "https://api.timeproofs.io"
      });

      const message = "Hello from the browser example";

      // 1) Hash locally (never sent raw)
      const hash = await tp.hashText(message);
      console.log("Hash:", hash);

      // 2) Request timestamp from API
      const ts = await tp.timestamp(hash);
      console.log("Timestamp response:", ts);

      // 3) Build proof bundle locally
      const bundle = tp.createBundle({
        hash: ts.hash,
        timestamp: ts.timestamp,
        proof: ts.proof,
        meta: {
          type: "demo",
          source: "browser-example"
        }
      });

      console.log("Bundle:", bundle);

      // 4) Optional offline verification (structure + hash)
      const result = await tp.verifyBundle(bundle);
      console.log("Verification:", result);
    })();
  </script>

</body>
</html>
