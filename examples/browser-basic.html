<!-- examples/browser-basic.html -->
<!-- Minimal browser example for TimeProofs v0.2 SDK (draft) -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TimeProofs v0.2 – Browser Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body style="font-family: system-ui; padding: 20px;">

  <h1>TimeProofs v0.2 – Browser Example</h1>
  <p>This page shows how to use the SDK directly in the browser.</p>

  <!-- Load the SDK -->
  <script src="../sdk/timeproof.js"></script>

  <script>
    (async () => {
      console.log("TimeProofs SDK loaded:", window.TimeProofs);

      const tp = TimeProofs.createClient({
        apiKey: "tp_test_xxx",
        baseUrl: "https://api.timeproofs.io"
      });

      const msg = "Hello from the browser example";

      // 1) Hash text
      const hash = await tp.hashText(msg);
      console.log("SHA-256 hash:", hash);

      // 2) Create a proof
      const proof = await tp.createProof({
        hash,
        label: "browser-example"
      });
      console.log("Proof:", proof);

      // 3) Verify via API
      const verify = await tp.verify({ hash });
      console.log("Verify:", verify);

      // 4) (future) offline verification
      // const bundle = await fetch("./demo.tproof.json").then(r => r.json());
      // const res = await TimeProofs.verifyOffline(bundle);
      // console.log("Offline validation:", res);

    })();
  </script>

</body>
</html>
